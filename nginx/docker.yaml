services:
  web:
    image: nginx:latest
    restart: always
    hostname: nginx
    command: [nginx-debug, '-g', 'daemon off;']
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:8080"
