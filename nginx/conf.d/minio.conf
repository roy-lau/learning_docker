
upstream minio_web {
    server minio:9001 weight=25 max_fails=2 fail_timeout=30s;
    # server minio1:9001 weight=25 max_fails=2 fail_timeout=30s;;
    # server minio2:9001 weight=25 max_fails=2 fail_timeout=30s;;
    # server minio3:9001 weight=25 max_fails=2 fail_timeout=30s;;
    # server minio4:9001 weight=25 max_fails=2 fail_timeout=30s;;
}

server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        default_type text/html;
        # echo "test";
        return 200 "reutrn test minio";
        # proxy_pass   http://minio_web;
        # rewrite ^/(.*) /minio/$1 permanent;
    }


    location /minio {
        # root   html;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;

        proxy_connect_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

       proxy_pass   http://minio_web;
    }
    location /minio_api {
       proxy_pass   http://minio_api;
    }
}

